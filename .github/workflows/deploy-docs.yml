name: Deploy Docs
run-name: "Deploy Docs — ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "packages/**"
  workflow_dispatch:

# id-token:write lets the GitHub OIDC provider mint a token that Azure trusts.
permissions:
  id-token: write
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: true

env:
  STORAGE_ACCOUNT: vardecdn
  SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  lint:
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://varde.variant.dev

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install

      - name: Build docs
        run: bun run build:docs

      - name: Azure login
        uses: ./.github/actions/azure-login
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION_ID }}

      # Syncs only the docs/ subdirectory of the build output to the $web/docs/
      # prefix, keeping /v/* and /static/* managed by other workflows untouched.
      - name: Sync docs to Azure Storage
        run: |
          az storage blob sync \
            --account-name "$STORAGE_ACCOUNT" \
            --container '$web' \
            --source docs/dist/docs/ \
            --destination docs \
            --delete-destination true \
            --auth-mode login \
            --only-show-errors

      # az storage blob sync doesn't support setting cache-control directly,
      # so we apply it in a follow-up pass. 300 seconds = 5 minutes.
      - name: Set cache-control on docs pages
        run: |
          az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name '$web' \
            --prefix docs/ \
            --auth-mode login \
            --query "[].name" \
            --output tsv | \
          xargs -I{} az storage blob update \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name '$web' \
            --name "{}" \
            --content-cache-control "public, max-age=300" \
            --auth-mode login \
            --only-show-errors

      # Uploads the root index page separately so it can't accidentally delete
      # other root-level blobs (/v/, /static/).
      - name: Upload root index page
        run: |
          az storage blob upload \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name '$web' \
            --file docs/dist/index.html \
            --name index.html \
            --content-type "text/html" \
            --content-cache-control "public, max-age=300" \
            --overwrite true \
            --auth-mode login \
            --only-show-errors

      # Purge the Front Door CDN cache so edge nodes pick up the new content
      # immediately instead of serving stale cached copies.
      # Non-fatal: if the service principal lacks permissions or the extension
      # isn't available, the deploy still succeeds (cache-control is the real fix).
      - name: Purge Front Door cache
        env:
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          az config set extension.dynamic_install_allow_preview=true
          az extension add --name cdn --allow-preview true --only-show-errors 2>/dev/null || true
          if az afd endpoint purge \
            --subscription "$SUBSCRIPTION_ID" \
            --resource-group shared-rg \
            --profile-name fd-shared-cdn \
            --endpoint-name shared-endpoint \
            --domains varde.variant.dev \
            --content-paths '/*'; then
            echo "::notice::Front Door cache purged"
          else
            echo "::warning::Front Door cache purge failed — verify role assignment in shared-rg"
          fi

      - name: Summary
        run: |
          echo "### ✅ Docs deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://varde.variant.dev" >> $GITHUB_STEP_SUMMARY
